services:
  #Local container swapped for amazon 

  analytics:
    build:
      context: ../analytics-service
      dockerfile: Dockerfile
    container_name: financial-analytics
    ports:
      - "8000:8000"
    networks:
      - financial-network
    restart: always

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: financial-backend
    ports:
      - "8080:8080"
        environment:
      - DB_HOST=${DB_HOST:://amazonaws.com}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-financial_db}
      - DB_USER=${DB_USER:-financial_user}
      - DB_PASSWORD=${DB_PASSWORD:-password123}
    depends_on:
      - analytics
    networks:
      - financial-network
    restart: always
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: financial-frontend
    ports:
      - "80:80"  
    depends_on:
      - backend
    networks:
      - financial-network
    restart: always 
networks:
  financial-network:
    driver: bridge


