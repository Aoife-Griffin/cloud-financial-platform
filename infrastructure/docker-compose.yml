### Used geek4geeks for base https://geeksforgeeks.org
services:
  financial_db:
    image: postgres:16-alpine
    container_name: financial_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: financial_db
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    networks:
      - financial-network

  analytics:
    build:
      context: ../analytics-service  
      dockerfile: Dockerfile
    container_name: financial-analytics
    ports:
      - "8000:8000"
    networks:
      - financial-network
    restart: always

  backend:
    build:
      context: ../backend        
      dockerfile: Dockerfile
    container_name: financial-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://financial_db:5432/financial_db
      - SPRING_DATASOURCE_USERNAME=financial_user
      - SPRING_DATASOURCE_PASSWORD=password123
    depends_on:
      - financial_db
      - analytics
    networks:
      - financial-network
    restart: always

  frontend:
    build:
      context: ../frontend   
      dockerfile: Dockerfile
    container_name: financial-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - financial-network
    restart: always

volumes:
  postgres_data_v2:
    driver: local

networks:
  financial-network:
    driver: bridge
