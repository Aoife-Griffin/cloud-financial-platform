server:
  port: 8081

spring:
  profiles:
    active: dev
  config:
    import: optional:aws-secretsmanager:production/financial/db
  cloud:
    aws:
      credentials:
        access-key: "AKIAZSFFX65WV2IIQR7Y"
        secret-key: "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"
      region:
        static: eu-north-1

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: always
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    export:
      cloudwatch:
        enabled: true
        namespace: FinancialPlatform
        batch-size: 20
        step: 1m

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:financial_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${aws.secretsmanager.host}:${aws.secretsmanager.port}/${aws.secretsmanager.dbname}
    username: ${aws.secretsmanager.username}
    password: ${aws.secretsmanager.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
